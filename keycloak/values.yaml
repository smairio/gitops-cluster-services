# =============================================================================
# Keycloak Helm Values - Codecentric Chart (keycloakx)
# =============================================================================
# Uses official Keycloak image from quay.io
# Uses external PostgreSQL (same cluster as AWX)
# Database is created by the db-init-job
# =============================================================================

# =============================================================================
# Image - Official Keycloak from Quay.io
# =============================================================================
image:
  repository: quay.io/keycloak/keycloak
  tag: "26.0"
  pullPolicy: IfNotPresent

# =============================================================================
# Replicas
# =============================================================================
replicas: 3

# =============================================================================
# Database Configuration - External PostgreSQL
# =============================================================================
database:
  vendor: postgres
  hostname: postgres-cluster-rw.postgres.svc.cluster.local
  port: 5432
  database: keycloak
  username: keycloak
  existingSecret: keycloak-postgres-secret
  existingSecretKey: password

# =============================================================================
# Proxy Configuration (TLS terminated at ingress)
# =============================================================================
proxy:
  enabled: true
  mode: xforwarded

# =============================================================================
# HTTP Configuration
# =============================================================================
http:
  relativePath: "/"

# =============================================================================
# Cache Configuration - Distributed (Infinispan) for multi-replica HA
# =============================================================================
# With replicas > 1, cache MUST be distributed. Local caches make in-flight
# login state (auth sessions + one-time OIDC codes) pod-local; without ingress
# affinity the browser round-robins to a pod that never issued the session,
# resetting the flow -> ERR_TOO_MANY_REDIRECTS. The actual cache mode/stack is
# set via the explicit args list below (authoritative over this block).
cache:
  stack: kubernetes

# =============================================================================
# Command and Arguments
# =============================================================================
command:
  - "/opt/keycloak/bin/kc.sh"
args:
  - "start"
  - "--hostname-strict=false"
  - "--http-enabled=true"
  - "--proxy-headers=xforwarded"
  - "--cache=ispn"
  - "--cache-stack=kubernetes"
  - "--spi-login-protocol-openid-connect-suppress-logout-confirmation-screen=true"

# =============================================================================
# Extra Environment Variables
# =============================================================================
extraEnv: |
  - name: KC_HEALTH_ENABLED
    value: "true"
  - name: KC_METRICS_ENABLED
    value: "true"
  # Point the JGroups "kubernetes" stack (DNS_PING) at the chart's headless
  # service so the 3 replicas discover each other and form one Infinispan cluster.
  - name: JAVA_OPTS_APPEND
    value: "-Djgroups.dns.query=keycloak-keycloakx-headless.keycloak.svc.cluster.local"
  - name: KEYCLOAK_ADMIN
    value: "admin"
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-secret
        key: admin-password
  - name: KC_SPI_REALM_IMPORT_DIR
    value: "/opt/keycloak/data/import"

# =============================================================================
# Service Configuration
# =============================================================================
service:
  type: ClusterIP
  httpPort: 80
  httpsPort: 443

# =============================================================================
# Resource Limits
# =============================================================================
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# =============================================================================
# Metrics
# =============================================================================
metrics:
  enabled: true

# =============================================================================
# Health
# =============================================================================
health:
  enabled: true

# =============================================================================
# Ingress - Disabled (managed separately)
# =============================================================================
ingress:
  enabled: false

# =============================================================================
# Node Placement - Schedule on general worker nodes only
# =============================================================================
nodeSelector:
  node-type: general
tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "general"
    effect: "NoSchedule"
